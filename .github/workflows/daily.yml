name: Daily Optical Brief Generator

on:
  schedule:
    - cron: '0 0 * * *'           # UTC 0点 = 北京时间早上8点
  workflow_dispatch:              # 允许手动触发（测试用）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and push new HTML
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "macmanaman123"
          git config --global user.email "你的邮箱@qq.com"
          git add public/
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || echo "No changes"
          git push https://x-access-token:${GH_TOKEN}@github.com/macmanaman123/optical-brief.git HEAD:main
